name: Method idea
description: Propose a change to how players are scored or evaluated
labels: [method]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you change, and what tennis or math argument says it is better?
    validations:
      required: true
  - type: textarea
    id: prediction
    attributes:
      label: Expected effect
      description: Which players should move, and in which direction? How would we know it worked?
    validations:
      required: true
